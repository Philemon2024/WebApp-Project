
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CODERWANDA Ltd</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #1e293b;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #dc2626;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .welcome h1 {
            color: #123c69;
            margin-bottom: 12px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .card h3 {
            color: #123c69;
            margin-bottom: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <h2>CODERWANDA Ltd</h2>
        <a href="/login">Logout</a>
    </header>

    <main class="container">

        <section class="welcome">
            <h1>Welcome to Your Dashboard!</h1>

            <p>
                You have successfully accessed the
                WebApp Project dashboard.
            </p>

            <p id="currentDate"></p>
        </section>

        <section class="cards">

            <div class="card">
                <h3>My Profile</h3>
                <p>Manage your personal information.</p>
            </div>

            <div class="card">
                <h3>Account</h3>
                <p>View your account information.</p>
            </div>

            <div class="card">
                <h3>Services</h3>
                <p>Explore available application services.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 CODERWANDA Ltd. All Rights Reserved.</p>
    </footer>

    <script>
        const date = new Date();

        document.getElementById("currentDate").textContent =
            "Today: " + date.toLocaleDateString();
    </script>

</body>
</html>
