
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CODERWANDA Ltd</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #123c69;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0b294a;
        }

        .message {
            margin-top: 15px;
            color: #dc2626;
            font-size: 14px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #123c69;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>User Login</h2>

        <p>Welcome back to CODERWANDA Ltd</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
                minlength="6"
            >

            <button type="submit">Login</button>

            <div class="message" id="message"></div>

        </form>

        <div class="links">
            <p>Don't have an account?
                <a href="/register">Register here</a>
            </p>

            <a href="/">Back to Home</a>
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                const message = document.getElementById("message");

                if (!email || !password) {
                    message.textContent = "Please fill in all fields.";
                    return;
                }

                message.style.color = "#16a34a";
                message.textContent =
                    "Login form validated successfully. Authentication will be connected later.";

            });
    </script>

</body>
</html>
